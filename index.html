<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pitter-Patter Raindrops • Interactive Storybook</title>

<style>
:root{
  --bg:#3F4A66;
  --panel:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.14);

  --text-main:#F5F1E8;
  --text-muted:rgba(245,241,232,.7);

  --teal:#7ebfd1;
  --yellow:#F6C85F;
  --red:#E45757;

  --radius:24px;
}

body{
  margin:0;
  font-family:system-ui,-apple-system;
  color:var(--text-main);
  background:linear-gradient(180deg,#2c364f,#3F4A66);
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* NAV */
.nav{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
}

.brand img{width:34px;border-radius:10px}

/* HERO */
.hero{
  margin-top:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
}

.card{
  background:rgba(255,255,255,.06);
  border-radius:var(--radius);
  padding:24px;
}

h1{font-size:42px;margin:10px 0}
.lead{color:var(--text-muted);line-height:1.6}

/* STORE BUTTONS */
.storeRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:520px){
  .storeRow{grid-template-columns:1fr}
}

.storeBtn{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:16px;

  background: rgba(126,191,209,0.18);
  border:1.5px solid var(--yellow);

  transition:.2s;
}

.storeBtn:hover{
  transform:translateY(-2px);
  background: rgba(126,191,209,0.28);
}

.mini{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(246,200,95,.4);
}

/* VIDEO */
.videoFrame{
  width:100%;
  aspect-ratio:16/9;
  border-radius:16px;
  overflow:hidden;
}

video{width:100%}

/* FEATURES */
.featuresGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

@media(max-width:900px){
  .featuresGrid{grid-template-columns:1fr}
}

.featureImg{
  padding:10px;
  border-radius:20px;
  overflow:hidden;
}

.featureImg img{
  width:calc(100% + 20px);
  margin-left:-10px;
  aspect-ratio:16/9;
  object-fit:cover;
}

/* IG GRID */
.igGrid{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

@media(max-width:900px){
  .igGrid{grid-template-columns:1fr 1fr}
}

.igCard{
  background:rgba(255,255,255,.05);
  border-radius:20px;
  overflow:hidden;
}

iframe{
  width:100%;
  height:100%;
  aspect-ratio:9/16;
  border:0;
}
</style>
</head>

<body>
<div class="wrap">

<header class="nav">
  <img src="icon.png">
  <strong>Pitter-Patter Raindrops</strong>
</header>

<section class="hero">

<div class="card">
<h1>A calming story<br>for little minds</h1>
<p class="lead">
Interactive bedtime storytelling with soothing rain,
gentle narration, and playful learning moments.
</p>

<div class="storeRow">
<a class="storeBtn" href="https://apps.apple.com/us/app/pitter-patter-raindrops-story/id6758880973">
<div class="mini"></div> App Store
</a>

<a class="storeBtn" href="https://play.google.com/store/apps/details?id=com.ppr.PitterpatterRaindrops">
<div class="mini">▶</div> Google Play
</a>

<a class="storeBtn" href="https://www.amazon.ca/Beauty-By-Zoiya-Pitter-Raindrops/dp/B0GNN1QFVL">
<div class="mini">🛍</div> Amazon
</a>
</div>
</div>

<div class="card">
<div class="videoFrame">
<video controls>
<source src="pprvideo.mp4">
</video>
</div>
</div>

</section>

<!-- FEATURES -->
<section class="card">
<h2>Explore the story world</h2>

<div class="featuresGrid">
<div class="featureImg"><img src="1.png"></div>
<div class="featureImg"><img src="3.png"></div>
<div class="featureImg"><img src="5.png"></div>
</div>
</section>

<!-- INSTAGRAM -->
<section>
<h2>From our community</h2>

<div class="igGrid">

<div class="igCard">
<iframe src="https://www.instagram.com/reel/DV-bw1tCnH2/embed"></iframe>
</div>

<div class="igCard">
<iframe src="https://www.instagram.com/reel/DUmsIjekRoQ/embed"></iframe>
</div>

<div class="igCard">
<iframe src="https://www.instagram.com/reel//DUq5u4mEgSq/embed"></iframe>
</div>

<div class="igCard">
<iframe src="https://www.instagram.com/reel/DVzu62IEffw/embed"></iframe>
</div>

</div>
</section>

</div>
</body>
</html>
